<form method="post" class="form-grid"><div class="field wide"><label>Full name<input name="full_name" value="{{ patient['full_name'] if patient else '' }}" required></label></div><div class="field"><label>Age<input name="age" type="number" min="1" max="120" value="{{ patient['age'] if patient else '' }}" required></label></div><div class="field"><label>Sex<select name="sex" required>{% for item in ['Female','Male'] %}<option {% if patient and patient['sex'] == item %}selected{% endif %}>{{ item }}</option>{% endfor %}</select></label></div><div class="field"><label>Phone<input name="phone" type="tel" value="{{ patient['phone'] if patient else '' }}"></label></div><div class="field"><label>Residence<select name="residence" required>{% for item in ['Urban','Rural'] %}<option {% if patient and patient['residence'] == item %}selected{% endif %}>{{ item }}</option>{% endfor %}</select></label></div><div class="field"><label>Marital status<select name="marital_status" required>{% for item in ['Single','Married','Divorced','Widowed'] %}<option {% if patient and patient['marital_status'] == item %}selected{% endif %}>{{ item }}</option>{% endfor %}</select></label></div><div class="field"><label>Education level<select name="education_level" required>{% for item in education %}<option {% if patient and patient['education_level'] == item %}selected{% endif %}>{{ item }}</option>{% endfor %}</select></label></div><div class="field"><label>Family history of DM<select name="family_history_dm" required>{% for item in ['Yes','No'] %}<option {% if patient and patient['family_history_dm'] == item %}selected{% endif %}>{{ item }}</option>{% endfor %}</select></label></div><div class="field"><label>Socioeconomic status<select name="socioeconomic_status" required>{% for item in ['Low','Medium','High'] %}<option {% if patient and patient['socioeconomic_status'] == item %}selected{% endif %}>{{ item }}</option>{% endfor %}</select></label></div><div class="wide"><button class="button" type="submit"><i class="fa-solid fa-check"></i> {{ 'Save changes' if patient else 'Create patient' }}</button></div></form>
