{% extends 'base.html' %}{% block title %}New prediction | Meltus Insight{% endblock %}{% block crumb %}New prediction{% endblock %}{% block content %}<div class="eyebrow">Linked clinical assessment</div><h1 class="heading">New diabetes prediction</h1><p class="sub">Select only the Patient ID, then provide the encoded model inputs.</p><form class="card prediction-container" method="post"><div class="form-grid prediction-grid"><div class="field wide"><label>Patient ID<select name="patient_id" required><option value="">Select Patient ID</option>{% for patient in patients %}<option value="{{ patient['id'] }}">{{ patient['id'] }}</option>{% endfor %}</select></label></div><div class="field"><label>Treatment type<select name="Treatment_Type"><option value="0">Pharmacological</option><option value="1">Healthy lifestyle counseling</option></select></label></div><div class="field"><label>Enrollment timing<select name="Enrollment_Timing"><option value="0">Newly enrolled</option><option value="1">Previously enrolled</option></select></label></div><div class="field"><label>Education category<select name="Edu_Category"><option value="0">Uneducated</option><option value="1">Educated</option></select></label></div><div class="field"><label>Marital status code<select name="Marital_Status"><option value="0">Married</option><option value="1">Single</option><option value="2">Divorced</option><option value="3">Widowed</option></select></label></div><div class="field"><label>Location type<select name="Loc_Type"><option value="0">Rural</option><option value="1">Urban</option></select></label></div><div class="field"><label>Age group<select name="Age_Group"><option value="0">Under 15</option><option value="1">15-29</option><option value="2">30-39</option><option value="3">40+</option></select></label></div><div class="field"><label>Sex code<select name="Sex"><option value="0">Female</option><option value="1">Male</option></select></label></div><div class="field"><label>Blood sugar<select name="Blood_Sugar"><option value="0">Normal</option><option value="1">Raised</option></select></label></div><div class="field"><label>Diabetes type<select name="Diabetes_Type"><option value="0">Type I</option><option value="1">Type II</option></select></label></div><div class="wide"><button class="button" type="submit"><i class="fa-solid fa-wand-magic-sparkles"></i> Generate and save prediction</button></div></div></form>{% endblock %}
